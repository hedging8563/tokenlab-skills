name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  client-configuration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test configuration, discovery, and task examples without real clients
        # Hermes 0.21.3 ships PyYAML and 0.21.6 ships ruamel.yaml; test both parsers.
        run: |
          python -m pip install PyYAML==6.0.3 ruamel.yaml==0.18.16
          python -m unittest discover -s tests -p 'test_*.py'

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Validate Agent Skills specification
        run: |
          for skill in skills/*; do
            uvx --from skills-ref agentskills validate "$skill"
          done

  installed-clients:
    name: Installed clients (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install the exact clients under test
        run: npm install --global @openai/codex@0.149.0 @anthropic-ai/claude-code@2.1.263 opencode-ai@1.18.31 @earendil-works/pi-coding-agent@0.85.1
      - name: Install the pinned YAML parsers for configuration tests
        run: python -m pip install PyYAML==6.0.3 ruamel.yaml==0.18.16
      - name: Load temporary profiles and complete loopback-only client requests
        env:
          TOKENLAB_INSTALLED_CLIENT_TESTS: '1'
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: python -m unittest discover -s tests -p 'test_configure_*.py'

  installed-hermes:
    name: Hermes ${{ matrix.hermes.version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 0.21.3 bundles PyYAML 6.0.3; 0.21.6 bundles ruamel.yaml 0.18.16 (Python >= 3.14) and no PyYAML.
        hermes:
          - {version: '0.21.3', tag: 'v2026.9.14', revision: '345cd2b057a452236de401d3534b8502a7465e8d', python: '3.13'}
          - {version: '0.21.6', tag: 'v0.21.6', revision: '818c13be1dc4fd28987e1e881a9408224afd4535', python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.hermes.python }}
      - name: Install the fixed official Hermes release in an isolated environment
        shell: python
        env:
          HERMES_TAG: ${{ matrix.hermes.tag }}
          HERMES_REVISION: ${{ matrix.hermes.revision }}
        run: |
          import os, pathlib, subprocess, sys, venv
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tokenlab-hermes-official'
          root.mkdir()
          source = root / 'source'
          subprocess.run(['git', '-c', 'core.longpaths=true', 'clone', '--depth', '1', '--branch',
                          os.environ['HERMES_TAG'], 'https://github.com/NousResearch/hermes-agent.git', str(source)], check=True)
          revision = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == os.environ['HERMES_REVISION'], revision
          runtime = root / 'venv'
          venv.EnvBuilder(with_pip=True).create(runtime)
          binary_dir = runtime / ('Scripts' if os.name == 'nt' else 'bin')
          python = binary_dir / ('python.exe' if os.name == 'nt' else 'python')
          hermes = binary_dir / ('hermes.exe' if os.name == 'nt' else 'hermes')
          subprocess.run([str(python), '-m', 'pip', 'install', '-e', str(source)], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'TOKENLAB_HERMES_PYTHON={python}\nTOKENLAB_HERMES_BIN={hermes}\n')
      - name: Preserve existing configuration and complete a loopback-only Hermes task
        shell: python
        env:
          TOKENLAB_HERMES_CLIENT_TESTS: '1'
        run: |
          import os, subprocess
          subprocess.run([os.environ['TOKENLAB_HERMES_PYTHON'], '-m', 'unittest', 'discover',
                          '-s', 'tests', '-p', 'test_configure_hermes*.py', '-v'], check=True)
