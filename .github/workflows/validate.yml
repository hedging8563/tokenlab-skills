name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  client-configuration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test configuration, discovery, and task examples without real clients
        run: python -m unittest discover -s tests -p 'test_*.py'

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Validate Agent Skills specification
        run: |
          for skill in skills/*; do
            uvx --from skills-ref agentskills validate "$skill"
          done

  installed-clients:
    name: Installed clients (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install the exact clients under test
        run: npm install --global @openai/codex@0.149.0 @anthropic-ai/claude-code@2.1.263 opencode-ai@1.18.31 @earendil-works/pi-coding-agent@0.85.1
      - name: Load temporary profiles with actual clients without inference
        env:
          TOKENLAB_INSTALLED_CLIENT_TESTS: '1'
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: python -m unittest discover -s tests -p 'test_configure_*.py'
