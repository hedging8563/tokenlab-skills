name: Sync model defaults

# Refresh the generated model lists in each SKILL.md and generated/availability.json
# from the live TokenLab catalog. A change ships as a patch release on main.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-models
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read the live catalog and rewrite the model blocks
        run: python scripts/sync_models.py
      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Raise the patch version and regenerate the catalog files
        id: bump
        if: steps.diff.outputs.changed == 'true'
        run: echo "version=$(python scripts/sync_catalog.py --bump-patch)" >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/sync_catalog.py --check
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          COMMIT_MESSAGE: "chore(skills): refresh model defaults in ${{ steps.bump.outputs.version }}"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json skills.sh.json README.md generated/availability.json .claude-plugin/plugin.json .claude-plugin/marketplace.json skills/*/SKILL.md
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:main
