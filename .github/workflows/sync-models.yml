name: Sync model defaults

# Refresh the generated model lists in each SKILL.md and generated/availability.json
# from the live TokenLab catalog. scripts/sync_models.py stops without writing when a
# catalog read fails or the catalog is too small. It routes the result:
#   none: nothing changed.
#   push: a small change (at most 3 skills, at most 2 turned unavailable); release it on main.
#   pr:   a larger change; open a pull request for a person to review.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-models
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      # The documentation-code tests run the JavaScript examples with Node.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Read the live catalog and rewrite the model blocks
        id: plan
        run: |
          python scripts/sync_models.py --allow-large --summary "$RUNNER_TEMP/sync-summary.json"
          python - "$RUNNER_TEMP/sync-summary.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          print(f"route={summary['route']}")
          print(f"changed={len(summary['changed_skills'])}")
          print(f"flips={len(summary['flips'])}")
          PY
      - name: Raise the patch version and regenerate the catalog files
        id: bump
        if: steps.plan.outputs.route != 'none'
        run: echo "version=$(python scripts/sync_catalog.py --bump-patch)" >> "$GITHUB_OUTPUT"
      - name: Validate skills and run the tests
        if: steps.plan.outputs.route != 'none'
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/sync_catalog.py --check
          for skill in skills/*; do
            uvx --from skills-ref agentskills validate "$skill"
          done
      - name: Commit
        if: steps.plan.outputs.route != 'none'
        env:
          COMMIT_MESSAGE: "chore(skills): refresh model defaults in ${{ steps.bump.outputs.version }}"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json skills.sh.json README.md generated/availability.json .claude-plugin/plugin.json .claude-plugin/marketplace.json skills/*/SKILL.md
          git commit -m "$COMMIT_MESSAGE"
      - name: Push a small change to main
        if: steps.plan.outputs.route == 'push'
        run: git push origin HEAD:main
      - name: Open a pull request for a large change
        if: steps.plan.outputs.route == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: sync-models/${{ github.run_id }}
          PR_TITLE: "chore(skills): model defaults changed for ${{ steps.plan.outputs.changed }} skills, ${{ steps.plan.outputs.flips }} now unavailable"
        run: |
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/sync-summary.json"
